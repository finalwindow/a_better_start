#name: CI · 多语言语法检查

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  syntax-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Python
      # ------------------------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Python syntax check (compileall)
        run: python -m compileall . -q

      - name: Python style check (flake8, warnings only)
        run: |
          pip install flake8
          flake8 . --max-line-length=120 --ignore=E501,W503 --exit-zero

      # ------------------------------------------------------------------
      # C / C++
      # ------------------------------------------------------------------
      - name: C/C++ syntax check (g++ -fsyntax-only)
        run: |
          find . \( -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
            -exec g++ -fsyntax-only {} \;

      # ------------------------------------------------------------------
      # Java
      # ------------------------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Java syntax check (javac)
        run: |
          find . -name "*.java" > sources.txt
          if [ -s sources.txt ]; then
            javac -d /tmp @sources.txt
          else
            echo "No Java files found, skipping."
          fi

      # ------------------------------------------------------------------
      # Node.js
      # ------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Node.js syntax check (eslint --quiet)
        run: |
          if [ -f package.json ]; then
            npm install
            npx eslint . --ext .js,.ts --quiet
          else
            echo "No package.json found, skipping."
          fi

      # ------------------------------------------------------------------
      # Summary
      # ------------------------------------------------------------------
      - name: All checks passed
        run: echo "All syntax checks passed."
